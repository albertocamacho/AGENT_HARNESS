<!-- Reference: Key CSS patterns for a well-built Pesto page -->
<style>
  /* ── Resets (provided by pesto.css, do not repeat) ── */

  /* ── Container pattern ── */
  .container {
    width: var(--pesto-content-width);
    margin-inline: auto;
  }

  /* ── Sticky nav ── */
  .nav {
    position: sticky; top: 0;
    z-index: var(--pesto-z-sticky);
    background: var(--pesto-surface-page);
    border-bottom: 1px solid var(--pesto-border-default);
    padding: var(--pesto-space-4) 0;
  }

  /* ── Primary button ── */
  .btn-primary {
    padding: var(--pesto-space-3) var(--pesto-space-6);
    background: var(--pesto-brand-600);
    color: var(--pesto-text-inverse);
    font-size: var(--pesto-text-sm);
    font-weight: var(--pesto-weight-medium);
    border: none;
    border-radius: var(--pesto-radius-md);
    cursor: pointer;
    transition: all 300ms var(--pesto-ease-interact);
    min-height: 44px;
  }
  .btn-primary:hover {
    background: var(--pesto-brand-700);
    transform: translateY(-1px);
    box-shadow: var(--pesto-shadow-md);
  }
  .btn-primary:focus-visible {
    outline: 2px solid var(--pesto-border-focus);
    outline-offset: 2px;
  }

  /* ── Card ── */
  .card {
    background: var(--pesto-surface-raised);
    border: 1px solid var(--pesto-border-default);
    border-radius: var(--pesto-radius-lg);
    padding: var(--pesto-space-6);
    box-shadow: var(--pesto-shadow-sm);
    transition: all 300ms var(--pesto-ease-interact);
  }
  .card:hover {
    box-shadow: var(--pesto-shadow-md);
    transform: translateY(-2px);
  }

  /* ── Section spacing ── */
  .section { padding: var(--pesto-space-20) 0; }

  /* ── Feature grid ── */
  .grid-3 {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: var(--pesto-space-8);
  }

  /* ── Badge ── */
  .badge {
    display: inline-block;
    padding: var(--pesto-space-1) var(--pesto-space-3);
    background: var(--pesto-brand-100);
    color: var(--pesto-brand-800);
    font-size: var(--pesto-text-xs);
    font-weight: var(--pesto-weight-medium);
    border-radius: var(--pesto-radius-full);
  }

  /* ── Stats ── */
  .stat-value {
    font-size: var(--pesto-text-4xl);
    font-weight: var(--pesto-weight-bold);
    color: var(--pesto-brand-600);
  }
  .stat-label {
    font-size: var(--pesto-text-sm);
    color: var(--pesto-text-secondary);
  }

  /* ── Responsive ── */
  @media (max-width: 1024px) {
    .grid-3 { grid-template-columns: repeat(2, 1fr); }
  }
  @media (max-width: 768px) {
    .grid-3 { grid-template-columns: 1fr; }
  }
</style>

<!-- Reference: Sample section structure -->
<section class="section">
  <div class="container">
    <h2 style="font-size:var(--pesto-text-2xl);font-weight:var(--pesto-weight-bold);margin-bottom:var(--pesto-space-4)">
      Section Heading
    </h2>
    <p style="font-size:var(--pesto-text-lg);color:var(--pesto-text-secondary);max-width:55ch;margin-bottom:var(--pesto-space-10)">
      Supporting description text.
    </p>
    <div class="grid-3">
      <article class="card">
        <h3 style="font-size:var(--pesto-text-xl);font-weight:var(--pesto-weight-semibold);margin-bottom:var(--pesto-space-2)">Card Title</h3>
        <p style="font-size:var(--pesto-text-sm);color:var(--pesto-text-secondary)">Card description text.</p>
      </article>
    </div>
  </div>
</section>
