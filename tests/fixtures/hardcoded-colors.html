<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hardcoded Colors Test</title>
  <style>
    body {
      font-family: "Inter", system-ui, sans-serif;
      color: #1c1917;
      background: #ffffff;
    }
    .hero {
      background: #16a34a;
      color: white;
      padding: 80px 32px;
      text-align: center;
    }
    .hero h1 {
      font-size: 3rem;
      font-weight: 700;
    }
    .hero p {
      font-size: 1.125rem;
      color: #f0fdf4;
      margin-top: 16px;
    }
    .card {
      background: #fff;
      border: 1px solid #e7e5e4;
      border-radius: 12px;
      padding: 24px;
      box-shadow: 0 1px 2px rgba(0, 0, 0, 0.05);
    }
    .btn-primary {
      background: #16a34a;
      color: #ffffff;
      border: none;
      border-radius: 8px;
      padding: 12px 24px;
      font-weight: 500;
      font-size: 14px;
      cursor: pointer;
    }
    .btn-primary:hover {
      background: #15803d;
    }
    .text-muted {
      color: #57534e;
    }
    a {
      color: #16a34a;
    }
    a:hover {
      color: #15803d;
    }
  </style>
</head>
<body>
  <section class="hero">
    <h1>Welcome to Pesto</h1>
    <p>A design system that keeps things consistent.</p>
    <button class="btn-primary">Get Started</button>
  </section>
  <main>
    <div class="card">
      <h2>Features</h2>
      <p class="text-muted">Everything you need to build great interfaces.</p>
    </div>
  </main>
</body>
</html>
